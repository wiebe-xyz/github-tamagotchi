name: Cleanup Invalid Repo Pets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type 'apply' to actually delete invalid placeholder rows. Anything else runs a dry-run only (default)."
        required: false
        default: "dry-run"

jobs:
  cleanup:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Run cleanup script against production
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          KUBECFG="$(mktemp)"
          echo "$KUBECONFIG_DATA" > "$KUBECFG"
          chmod 600 "$KUBECFG"
          export KUBECONFIG="$KUBECFG"

          NS="tama-prod"
          ACTIVE=$(kubectl get service github-tamagotchi -n "$NS" \
            -o jsonpath='{.spec.selector.version}')
          POD=$(kubectl get pod -n "$NS" \
            -l app=github-tamagotchi,version="$ACTIVE" \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD" ]; then
            echo "ERROR: no running pod found for active color $ACTIVE in $NS"
            exit 1
          fi

          ARGS=""
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then
            ARGS="--apply"
            echo "Running with --apply: invalid placeholder rows WILL be deleted."
          else
            echo "Dry run (default): no changes will be made."
          fi

          echo "Executing in pod $POD ($NS, active=$ACTIVE)"
          kubectl exec -n "$NS" "$POD" -c github-tamagotchi -- \
            python -m github_tamagotchi.scripts.cleanup_invalid_repo_pets $ARGS
