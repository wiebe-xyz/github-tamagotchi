name: Diagnose GitHub Health Sync

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo to test the health sync against"
        required: false
        default: "wiebe-xyz/github-tamagotchi"

jobs:
  diagnose:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Run a live get_repo_health() inside the production pod
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          KUBECFG="$(mktemp)"
          echo "$KUBECONFIG_DATA" > "$KUBECFG"
          chmod 600 "$KUBECFG"
          export KUBECONFIG="$KUBECFG"

          NS="tama-prod"
          ACTIVE=$(kubectl get service github-tamagotchi -n "$NS" \
            -o jsonpath='{.spec.selector.version}')
          POD=$(kubectl get pod -n "$NS" \
            -l app=github-tamagotchi,version="$ACTIVE" \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD" ]; then
            echo "ERROR: no running pod found for active color $ACTIVE in $NS"
            exit 1
          fi

          REPO="${{ github.event.inputs.repo }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          echo "Testing GitHub health sync for $OWNER/$NAME in pod $POD ($NS, active=$ACTIVE)"
          echo "Note: this only prints derived results (failed check names, status codes,"
          echo "booleans) -- the token value itself is never printed."

          cat > /tmp/diagnose.py <<PYEOF
          import asyncio
          import httpx
          from github_tamagotchi.core.config import settings
          from github_tamagotchi.services.github import GitHubService

          async def main():
              print("token configured:", bool(settings.github_token))
              print("token length:", len(settings.github_token) if settings.github_token else 0)

              svc = GitHubService()

              async with httpx.AsyncClient() as client:
                  headers = {"Accept": "application/vnd.github.v3+json"}
                  if settings.github_token:
                      headers["Authorization"] = f"Bearer {settings.github_token}"
                  resp = await client.get("https://api.github.com/rate_limit", headers=headers)
                  print("raw /rate_limit status:", resp.status_code)
                  if resp.status_code != 200:
                      print("raw /rate_limit body:", resp.text[:500])
                  else:
                      body = resp.json()
                      print("rate limit core remaining:", body.get("resources", {}).get("core", {}))

                  # Bypass the app's internal logger (may not be configured outside
                  # full app startup) and catch the raw exception directly, plus
                  # try the exact same request _get_last_commit makes, by hand.
                  try:
                      raw = await client.get(
                          f"https://api.github.com/repos/$OWNER/$NAME/commits",
                          headers=headers,
                          params={"per_page": 1},
                      )
                      print("raw commits call status:", raw.status_code)
                      if raw.status_code != 200:
                          print("raw commits call body:", raw.text[:500])
                  except Exception as e:
                      print("raw commits call raised:", type(e).__name__, str(e))

                  try:
                      last_commit_direct = await svc._get_last_commit(client, "$OWNER", "$NAME")
                      print("_get_last_commit() direct result:", last_commit_direct)
                  except Exception as e:
                      import traceback
                      print("_get_last_commit() raised:", type(e).__name__, str(e))
                      traceback.print_exc()

              health = await svc.get_repo_health("$OWNER", "$NAME")
              print("failed_checks:", health.failed_checks)
              print("last_commit_at:", health.last_commit_at)
              print("open_prs_count:", health.open_prs_count)
              print("open_issues_count:", health.open_issues_count)
              print("last_ci_success:", health.last_ci_success)

          asyncio.run(main())
          PYEOF

          kubectl cp /tmp/diagnose.py "$NS/$POD:/tmp/diagnose.py" -c github-tamagotchi
          kubectl exec -n "$NS" "$POD" -c github-tamagotchi -- python /tmp/diagnose.py
